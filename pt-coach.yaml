# PT Coach data file
# -------------------
# This file holds all your exercises and routines. Edit it directly on
# GitHub (click the file, then the pencil/edit icon) to add, change, or
# remove anything. The app reads this file fresh every time it loads.
#
# Each exercise needs: id, name, steps (a list), sets, reps, hold (seconds)
# Each routine needs: id, name, exercises (a list of exercise ids, in order)
#
# Source mapping (verified directly against each PDF by filename):
#   program1.pdf (16 exercise pages, prepared by Allison Pallotta) -> PS-A -> routine "Allison - Back"
#   program2.pdf (12 exercise pages, neck/shoulder program)        -> PS-N -> routine "Prosports - Neck"
#   program3.pdf (10 exercise pages, prepared by David Watson)     -> PS-B -> routine "Prosports - Back"

exercises:

  - id: EX-01
    name: Full Body Stretch
    sets: 1
    reps: 3
    hold: null
    steps:
      - Lie on your back on the mat.
      - Stretch your arms overhead and reach your legs in the opposite direction with toes pointed away to extend the full body.
      - Relax the upper body and arms while flexing your toes back toward your nose, letting your lower body, knees, and hips sink into the mat.

  - id: EX-02
    name: Toe Scrunch and Splay
    sets: 1
    reps: 5
    hold: 2
    steps:
      - Lie on your back with legs extended.
      - Alternately splay your toes wide and scrunch them tight.
      - Hold each position for 2 seconds.

  - id: EX-03
    name: Ankle Rotations
    sets: 1
    reps: 5
    hold: null
    steps:
      - Rotate your ankles in a smooth circle 5 times clockwise.
      - Reverse direction and rotate 5 times counter-clockwise.

  - id: EX-04
    name: Feet Windshield Wipers with Edge Hold
    sets: 1
    reps: 5
    hold: null
    steps:
      - Place your feet towards the outer edges of the mat.
      - Swivel your feet side-to-side like windshield wipers.
      - Hold the stretch briefly at the end of each motion.

  - id: EX-05
    name: Lying Hip Cars
    sets: 1
    reps: 5
    hold: null
    steps:
      - Lie straight on your back.
      - Perform 5 circles in one direction, then 5 in the opposite direction.
      - Repeat on the other leg.

  - id: EX-06
    name: Cooldown Leg Shake or Windshield Wipers
    sets: 1
    reps: 4
    hold: null
    steps:
      - Shake your legs out or gently sway your knees side-to-side to relax the hip joint after strenuous movement.

  - id: EX-07
    name: Straight Leg Raises (Toes Flexed)
    sets: 1
    reps: 5
    hold: null
    steps:
      - Lie on your back with legs extended hip-width apart and knees pressed down firmly.
      - Flex your toes toward your nose to keep the calf and leg fully engaged.
      - Raise one leg up to 60 degrees while keeping it stiff, then lower it back down.
      - Straighten the knee at the bottom before lifting again. Repeat on both sides.

  - id: EX-08
    name: Wide-Stance Straight Leg Raises
    sets: 1
    reps: 5
    hold: null
    steps:
      - Position your heels out near the edges of the mat.
      - Keep your legs stiff with toes flexed toward your nose.
      - Perform straight leg raises up to 60 degrees from this wider stance.

  - id: EX-09
    name: Half Butterfly Stretch
    sets: 1
    reps: 3
    hold: 2
    steps:
      - Lie down with both knees bent and feet flat on the floor.
      - Let one knee drop out to the side toward the floor while keeping the other knee bent.
      - Hold the stretch to allow the hip to open, then return to center and repeat on the opposite side.
      - Progressive note: Can advance to Full Butterfly and do flaps once hips are warmed up.

  - id: EX-10
    name: 90/90 Supine Knee Drops
    sets: 1
    reps: 3
    hold: 2
    steps:
      - Place your feet flat at the outer edges of the mat with knees bent.
      - Lower both knees together toward one side, holding the stretch at the end range.
      - Alternate sides for 3 holds in each direction.

  - id: EX-11
    name: Figure-4 Knee Press & Pull
    sets: 1
    reps: 1
    hold: null
    steps:
      - Lie on your back, cross your left ankle over your right knee.
      - Push the left knee away using its own muscle strength (without using hands) and hold.
      - Next, gently pull that left knee toward your right shoulder/armpit and hold for a few seconds.

  - id: EX-12
    name: Figure-4 Piriformis Squeeze & Release
    sets: 1
    reps: 5
    hold: null
    steps:
      - Maintaining the Figure-4 leg position, draw the bottom leg in toward your chest on an exhale.
      - Release slightly on the inhale.
      - Repeat 5 times, pulling slightly closer with each breath.

  - id: EX-13
    name: Figure-4 Side-to-Side Drops
    sets: 1
    reps: 3
    hold: null
    steps:
      - Keep shoulders flat on the floor and extend arms out to the sides.
      - Drop your crossed legs to the right, using your right hand to gently guide the left knee down. Hold at the end.
      - Drop legs to the left side (letting the uncrossed leg assist pulling the knee down). Hold at the end.
      - Repeat the full sequence on the opposite leg.

  - id: EX-14
    name: Glute Bridges with Top Hold
    sets: 1
    reps: 10
    hold: null
    steps:
      - Bend knees with feet flat on the floor close to your glutes.
      - Inhale going down; exhale as you lift your hips up into a bridge.
      - Engage your core and hold at the top position.
      - Progression note: Add marching in place at the top of the bridge position once strength improves.

  - id: EX-15
    name: Figure-4 Glute Bridges
    sets: 1
    reps: 5
    hold: null
    steps:
      - Cross one ankle over the opposite knee.
      - Press the active knee outward under its own power.
      - Drive through the planted foot to lift hips into a bridge. Repeat 5 times per side.

  - id: EX-16
    name: Ardha Pawanmuktasana (Single Knee-to-Chest)
    sets: 1
    reps: 2
    hold: null
    steps:
      - Extend one leg straight along the floor.
      - Pull the opposite knee up toward your chest/armpit.
      - Hold the stretch, relax, and repeat twice on each side.

  - id: EX-17
    name: Happy Baby Pose
    sets: 1
    reps: 10
    hold: null
    steps:
      - Lie on your back, bend knees toward your chest, and grip the outside edges of your feet or ankles.
      - Keep your lower back grounded as you gently pull knees down toward the floor.

  - id: EX-18
    name: Leg Circles & Rainbow Arc Swings
    sets: 1
    reps: 5
    hold: null
    steps:
      - Raise one leg straight up with foot flexed/pointed to warm up the hip.
      - Perform 5 small circles clockwise, then 5 counter-clockwise.
      - Move the leg left and right in a rainbow shape, hold at the ends.

  - id: EX-19
    name: Dead Bug (Hover Variation)
    sets: 1
    reps: 5
    hold: null
    steps:
      - Lie on your back with arms reaching up and knees bent in a 90-degree tabletop position.
      - Tighten your core and extend opposite arm and leg away from each other.
      - Hover both arm and foot just above the floor without touching down.
      - Return to center and alternate sides for 5 repetitions each.

  - id: EX-20
    name: Heel Slides
    sets: 1
    reps: 5
    hold: null
    steps:
      - Lie flat on your back with legs extended.
      - Slowly slide one heel along the mat toward your buttocks, bending the knee, then slide it back out straight.
      - Alternate legs or perform 5 reps per side.

  - id: EX-26
    name: Side-Lying Clamshells
    sets: 1
    reps: 10
    hold: null
    steps:
      - Lie on one side with knees bent at a 90-degree angle and hips stacked.
      - Engage your core and perform a subtle pelvic tilt, keeping your front hip rolled slightly forward so it does not open or roll backward.
      - Keep feet together as you raise your top knee up, then slowly lower.
      - Repeat 10 times per side (resistance band optional).

  - id: EX-27
    name: Side-Lying Straight Leg Raise with Heel Twist
    sets: 1
    reps: 5
    hold: null
    steps:
      - Lie on your side with the bottom leg slightly bent for stability and top leg extended straight.
      - Lift the top leg straight up while internally rotating the hip so your heel points upward and toes point slightly down.
      - Return the foot to a neutral position as you lower it back down.
      - Perform 5 reps per side.

  - id: EX-28
    name: Inner Thigh Lift (Adductor Lift)
    sets: 1
    reps: 10
    hold: null
    steps:
      - Lie on your right side with right leg extended straight on the ground.
      - Cross your left (top) leg over, placing the left foot flat on the floor in front of you (or supported on a foam roller) to clear space.
      - Lift your straight bottom (right) leg up off the mat in a small, controlled motion, twisting your heel upward as it lifts.
      - Lower back down to neutral. Perform 10 reps, then switch sides.

  - id: EX-29
    name: Side-Lying Open Book (Thoracic Rotation)
    sets: 1
    reps: 10
    hold: 2
    steps:
      - Lie on your side with arms extended straight out in front at chest height (palms touching).
      - Rest your top bent knee over a foam roller or pillow in front of you for support.
      - Sweep your top arm open in an arc across your chest to the opposite side, keeping your eyes on your fingertips.
      - Ensure your top knee/foot remains grounded on the roller/floor throughout the twist.
      - Pause briefly at the open end range, then return. Perform 10 reps per side.

  - id: EX-30
    name: Sphinx Pose
    sets: 1
    reps: 5
    hold: 5
    steps:
      - Lie flat on your stomach with forehead resting on your hands for a few deep breaths.
      - Prop up onto your forearms into a Sphinx pose.
      - Inhale and puff your chest forward while looking straight ahead (keeping gaze level, not straining neck up).
      - Exhale to relax. Perform 5 small chest-puffing reps, then hold the position for a 5-count.

  - id: EX-31
    name: Ardha Shalabhasana
    sets: 1
    reps: 5
    hold: 2
    steps:
      - Lie flat on your stomach with hands placed under your thighs/groin for support.
      - Keeping your leg completely straight, lift one leg upward without letting that hip peel off the floor.
      - Lower back down and alternate legs for 5 full rounds.
      - Hold the final repetition extra for a few seconds.

  - id: EX-32
    name: Airplane Arms & Leg Lift
    sets: 1
    reps: 5
    hold: null
    steps:
      - Lie on your stomach with arms extended out to the sides like airplane wings.
      - Lift your chest, arms, and straight legs up slightly off the mat, squeezing your shoulder blades together.
      - Hold briefly at the top before lowering down.

  - id: EX-33
    name: Dynamic Child's Pose to Modified Upward Dog
    sets: 1
    reps: 5
    hold: null
    steps:
      - Begin in Child's Pose, sitting hips back toward heels with arms extended out in front.
      - Keeping hands planted in place, dynamically shift your body forward and drop hips down toward the floor into a modified Upward Dog (knees remaining on the mat, palms directly under shoulders).
      - Flow back and forth between Child's Pose and Upward Dog in a continuous motion.

  # -----------------------------------------------------------------------

  - id: EX-34
    name: Cat-Cow Stretch
    sets: 1
    reps: 5
    hold: null
    steps:
      - Move onto all fours (tabletop position) with wrists under shoulders and knees under hips.
      - Inhale, arch your back, and lift your chest/tailbone (Cow).
      - Exhale, round your spine toward the ceiling, and tuck your chin (Cat).

  - id: EX-35
    name: Kneeling Backbend
    sets: 1
    reps: 3
    hold: null
    steps:
      - Come to a tall kneeling position on your knees.
      - Place hands on your lower back/hips and gently arch backward within a comfortable range of motion.

  - id: EX-36
    name: Low Lunge
    sets: 1
    reps: 3
    hold: 15
    steps:
      - From kneeling, step one foot forward into a half-kneeling lunge position (use yoga blocks under hands for support if needed).
      - Shift your hips forward and backward slightly to feel the stretch in the front hip flexor/groin.
      - Maintain an upright torso before switching sides.

  - id: EX-37
    name: Downward-Facing Dog to Standing Transition
    sets: 1
    reps: 1
    hold: 10
    steps:
      - Tuck toes and lift hips high into Downward-Facing Dog, pressing hands into the mat and pedaling feet if desired.
      - Walk hands back toward your feet and slowly roll up to standing position.

  # ---- program1.pdf: Allison - Back (PS-A) ----
  - id: PS-A-1
    name: Supine Leg Raise with Strap
    sets: 3
    reps: null
    hold: 30
    steps:
      - Begin lying on your back with your legs straight, holding the end of a strap that is looped around one foot.
      - Use the strap to pull your leg up toward your body until you feel a gentle stretch in the back of your upper leg. Hold this position.
      - Make sure to keep your other leg straight on the ground during the stretch.

  - id: PS-A-2
    name: Supine Piriformis Stretch with Leg Straight
    sets: 3
    reps: null
    hold: 30
    steps:
      - Begin by lying on your back with your legs straight.
      - Bring one leg up toward your opposite shoulder, grabbing the outside of your knee with your hand, until you feel a stretch in your buttocks.
      - Make sure to keep your low back flat against the floor and do not allow your trunk to twist during the stretch.

  - id: PS-A-3
    name: Supine Quadriceps Stretch with Strap on Table
    sets: 3
    reps: null
    hold: 30
    steps:
      - Begin lying on your back on a table or bed with one leg hanging off the edge, holding the end of a strap that is draped over your shoulder and secured around your foot.
      - Slowly pull on the strap, bending your knee until you feel a stretch in the front of your thigh. Hold this position.
      - Make sure not to arch your low back during the stretch.

  - id: PS-A-4
    name: Supine Pelvic Tilt
    sets: 2
    reps: 10
    hold: 5
    steps:
      - Begin by lying on your back with your knees bent and feet resting on the floor.
      - Slowly bend your low back and tilt your pelvis backward into the floor, then return to the starting position and repeat.
      - Make sure to only move your pelvis and low back and keep the rest of your body relaxed.

  - id: PS-A-5
    name: Supine Squeeze Ball between Knees
    sets: 2
    reps: 10
    hold: 5
    steps:
      - Begin lying on your back with your legs bent, feet resting on the floor, and a soft ball positioned between your knees.
      - Squeeze your knees together into the ball, then release and repeat.
      - Make sure to keep your back flat against the floor during the exercise.

  - id: PS-A-6
    name: Supine March with Band
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin lying on your back with your knees bent, feet resting on the floor, and a resistance band or loop secured around your legs.
      - Tighten your abdominals and slowly raise one of your legs off the floor, keeping your knee bent. Then return to the starting position and repeat with your other leg.
      - Make sure to keep your trunk still during the exercise and do not let your low back arch.

  - id: PS-A-7
    name: Supine Isometric Clamshell with Band
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin by lying on your back with your knees bent and feet resting on the floor, with a resistance band or loop secured around your knees.
      - Keep one leg stationary as you draw your other leg outward, and hold.
      - Make sure to not arch your low back during the exercise.

  - id: PS-A-8
    name: Supine Shoulder Horizontal Abduction with Resistance
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin lying on your back with your knees bent and the ends of a resistance band in each hand. Your arms should be straight up toward the ceiling.
      - Pull your arms apart against the resistance band, straight out to your sides, then slowly bring them back to the starting position and repeat.
      - Make sure to keep your back flat on the floor during the exercise.

  - id: PS-A-9
    name: Supine Shoulder External Rotation with Resistance
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin lying on your back holding the ends of a resistance band in each hand.
      - Rotate your hands outward, keeping your elbows bent and pulling the band apart.
      - Make sure to keep your back flat and do not shrug your shoulders.

  - id: PS-A-10
    name: Standing Tandem Balance with Counter Support
    sets: 3
    reps: null
    hold: 30
    steps:
      - Begin in a standing upright position with your hands resting on a counter.
      - Place one foot directly behind the other, so that you are in a heel-to-toe position. Maintain your balance in this position.
      - Make sure to maintain an upright posture and use the counter to help you balance as needed.

  - id: PS-A-11
    name: Standing Hip Abduction with Resistance at Ankles and Counter Support
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin in a standing upright position with your hands resting on a counter in front of you and a resistance band looped around your ankles.
      - Shift your weight to one side and pick the other foot up, pushing against the resistance. Hold briefly, then slowly return to the starting position and repeat leaning to the other side.
      - Make sure to maintain an upright posture and use the counter to help you balance as needed.

  - id: PS-A-12
    name: Long Sitting Calf Stretch with Strap
    sets: 3
    reps: null
    hold: 30
    steps:
      - Begin sitting on the floor with one foot stretched in front of you, your other knee bent, and a strap secured around your foot.
      - Slowly pull your foot towards you with the strap until you feel a stretch in your calf.
      - Make sure to keep your knee straight during the stretch.

  - id: PS-A-13
    name: Great Toe Flexion with Resistance
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin sitting in an upright position on the floor with a resistance band looped vertically along your foot, under your heel and over your toes, holding the ends in your hand.
      - Push your big toe forward against the resistance band, then bring it back to the starting position and repeat.
      - Make sure to focus your movements on your big toe.

  - id: PS-A-14
    name: Long Sitting Ankle Inversion with Resistance
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin sitting upright on the floor with your legs crossed and a resistance band secured around one foot. The resistance band should be looped around the bottom of your other foot with the end held in your hand.
      - Move the foot with the resistance band away from the other foot by rotating your ankle inward, then slowly return to the starting position and repeat.
      - Make sure to avoid any hip movement.

  - id: PS-A-15
    name: Long Sitting Ankle Eversion with Resistance
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin sitting upright on the floor with a resistance band secured around one foot. The resistance band should be looped around the bottom of your other foot with the end held in your hand.
      - Move the foot with the resistance band away from the other foot by rotating your ankle outward, then slowly return to the starting position and repeat.
      - Make sure to avoid any hip movement.

  - id: PS-A-16
    name: Seated Calf Raise with Weights on Thighs On Step
    sets: 2
    reps: 10
    hold: null
    steps:
      - Begin sitting upright on a bench holding a dumbbell across your thighs (no weight yet). Have a low step (or foam pad) placed under the balls of your feet.
      - Slowly raise both heels at the same time. Then, lower them down to the starting position. Repeat.
      - Make sure to keep the balls of your feet in contact with the step throughout the exercise. Raise your heels as high as possible.

  # ---- program2.pdf: Prosports - Neck (PS-N) ----
  - id: PS-N-1
    name: Seated Cervical Retraction
    sets: 2
    reps: 10
    hold: 5
    steps:
      - Begin sitting in an upright position with your feet flat on the floor.
      - Gently draw your chin in, while keeping your eyes fixed on something in front of you.
      - Make sure that you do not look down as you do this exercise, or bend your neck forward.

  - id: PS-N-2
    name: Seated Cervical Sidebending Stretch
    sets: 1
    reps: 4
    hold: 30
    steps:
      - Begin sitting in an upright position.
      - Use one hand to tilt your head sideways, pulling your ear toward one shoulder until you feel a stretch in the opposite side of your neck, and hold.
      - Make sure to keep your back straight and do not let your head rotate, or bend forward or backward.

  - id: PS-N-3
    name: Seated Levator Scapulae Stretch
    sets: 1
    reps: 4
    hold: 30
    steps:
      - Begin sitting upright in a chair, grasping the edge with one hand.
      - Rotate your head to the side opposite your anchored arm, then tuck your chin towards your chest. With your free hand, grasp the back of your head and gently pull it downward until you feel a stretch and hold.
      - Make sure to keep your back straight during the exercise.

  - id: PS-N-4
    name: Corner Pec Minor Stretch
    sets: 1
    reps: 4
    hold: 30
    steps:
      - Begin in a standing upright position facing a corner. Keeping your arms straight, place your forearms flat on the wall on each side of the corner.
      - Slowly lean forward, taking a small step if needed, until you feel a gentle stretch in the front of your shoulders. Hold this position.
      - Make sure to keep your upper back and neck relaxed. Do not shrug your shoulders during the stretch.

  - id: PS-N-5
    name: Standing Shoulder Row with Anchored Resistance
    sets: 3
    reps: 10
    hold: null
    steps:
      - Begin standing upright, holding both ends of a resistance band that is anchored in front of you at chest height, with your palms facing inward.
      - Pull your arms back with your elbows tucked at your sides, then return to the starting position and repeat.
      - Make sure to keep your core engaged and focus on squeezing your shoulder blades together as you pull on the band.

  - id: PS-N-6
    name: Shoulder Extension with Resistance - Neutral
    sets: 3
    reps: 10
    hold: null
    steps:
      - Begin standing upright with your arms straight forward and palms facing inward, holding the ends of a resistance band that is anchored overhead in front of you.
      - Pull your arms down to your sides, squeezing your shoulder blades together. Then bring them back up to the starting position and repeat.
      - Make sure to keep your elbows and back straight, and do not shrug your shoulders during the exercise.

  - id: PS-N-7
    name: Shoulder External Rotation and Scapular Retraction with Resistance
    sets: 2
    reps: 10
    hold: 5
    steps:
      - Begin in an upright standing position with your arms by your sides, holding a resistance band in both hands. Bend your elbows to approximately 90 degrees with your palms up.
      - Slowly rotate your forearms out to the side. As you do so, pinch your shoulder blades down and back together. Pause briefly, then return to the starting position.
      - Make sure that you keep the bend in your elbows as you rotate your arms. Avoid shrugging your shoulders.

  - id: PS-N-8
    name: Sidelying Open Book Thoracic Rotation with Knee on Foam Roll
    sets: 2
    reps: 15
    hold: null
    steps:
      - Begin lying on your side with your bottom leg straight, and your top leg bent at 90 degrees, resting on a foam roll. Your arms should be straight and together in front of you on the ground.
      - Slowly move your top arm away from your other arm, bringing it to the floor behind you, and rotating your upper trunk. Next, bring your arms back together, and repeat.
      - Make sure to keep your top leg on the foam roll.

  - id: PS-N-9
    name: Seated Lumbar Flexion Stretch
    sets: 1
    reps: 4
    hold: 30
    steps:
      - Begin sitting in a chair with your knees spread apart.
      - Bend forward, letting your arms hang toward the ground until you feel a stretch in your lower back.
      - Make sure to keep your movements slow and controlled and do not rise up off the chair when you bend forward.

  - id: PS-N-10
    name: Supine Single Knee to Chest Stretch
    sets: 1
    reps: 4
    hold: 30
    steps:
      - Begin lying on your back with your legs straight.
      - Using your hands, slowly pull one knee toward your chest until you feel a gentle stretch in your lower back.
      - Make sure to keep your back relaxed and flat on the ground during the stretch.

  - id: PS-N-11
    name: Supine Bridge
    sets: 3
    reps: 10
    hold: null
    steps:
      - Begin lying on your back with your arms resting at your sides, your legs bent at the knees and your feet flat on the ground.
      - Tighten your abdominals and slowly lift your hips off the floor into a bridge position, keeping your back straight.
      - Make sure to keep your trunk stiff throughout the exercise and your arms flat on the floor.

  - id: PS-N-12
    name: Dead Bug
    sets: 3
    reps: 10
    hold: null
    steps:
      - Begin lying on your back with your legs bent.
      - Lift your legs and arms off the ground, keeping your knees bent. Lower one arm to the ground and lower your opposite leg at the same time. Repeat with your opposite arm and leg, then continue this movement.
      - Make sure to keep your abdominals stiff as you lower your arm and leg, and do not let your low back arch off the ground.

  # ---- program3.pdf: Prosports - Back (PS-B) ----
  - id: PS-B-1
    name: Supine Quadriceps Stretch with Strap on Table
    sets: 1
    reps: 3
    hold: 30
    steps:
      - Begin lying on your back on a table or bed with one leg hanging off the edge, holding the end of a strap that is draped over your shoulder and secured around your foot.
      - Slowly pull on the strap, bending your knee until you feel a stretch in the front of your thigh. Hold this position.
      - Make sure not to arch your low back during the stretch.

  - id: PS-B-2
    name: Hooklying Hamstring Stretch with Strap
    sets: 1
    reps: 3
    hold: 30
    steps:
      - Begin lying on your back holding the end of a strap secured around one foot with your legs bent and feet flat on the floor.
      - Straighten your leg with the strap and pull it toward yourself until you feel a stretch in the back of your thigh and hold.
      - You can have a slight bend in your knee but keep your foot straight.

  - id: PS-B-3
    name: Standing Quadratus Lumborum Stretch with Doorway
    sets: 1
    reps: 3
    hold: 30
    steps:
      - Begin in a standing upright position to the side of a doorframe.
      - Cross your outside leg behind the other and hold onto the doorframe, then slowly lean your hips away until you feel a gentle stretch along the side of your body.
      - Make sure to maintain a gentle stretch and only move in a comfortable range.

  - id: PS-B-4
    name: Supine Piriformis Stretch with Foot on Ground
    sets: 1
    reps: 3
    hold: 30
    steps:
      - Begin by lying on your back with both knees bent and feet resting flat on the ground. Cross one leg over the other so your foot is resting on your knee.
      - Grab your leg just below the knee and slowly draw it towards your opposite shoulder until you feel a stretch in your buttocks.
      - Do not allow your back to twist or bend excessively during the stretch.

  - id: PS-B-5
    name: Hip Extension with Resistance Loop
    sets: 3
    reps: 10
    hold: null
    steps:
      - Begin in a standing upright position with a resistance band looped around your ankles, holding a stable object for balance.
      - Lift one leg backward, keeping your knee straight. Then bring it back to the starting position and repeat.
      - Make sure to keep your abdominals tight and your back straight during the exercise.

  - id: PS-B-6
    name: Hip Abduction with Resistance Loop
    sets: 3
    reps: 10
    hold: null
    steps:
      - Begin in a standing upright position with a resistance band looped around your ankles, holding a stable object for balance.
      - Lift one leg to your side, keeping your knee straight. Return to the starting position and repeat.
      - Make sure to keep your abdominals tight and your back straight during the exercise.

  - id: PS-B-7
    name: Supine Bridge with Resistance Band
    sets: 3
    reps: 10
    hold: null
    steps:
      - Begin lying on your back with your arms laying at your sides, your legs bent at the knees and your feet flat on the ground, with a resistance band secured around your legs.
      - Maintaining tension in the resistance band, tighten your abdominals and slowly lift your hips off the floor into a bridge position, keeping your back straight.
      - Make sure to keep your trunk stiff throughout the exercise and your arms flat on the floor.

  - id: PS-B-8
    name: Standing Anti-Rotation Press with Anchored Resistance
    sets: 1
    reps: 10
    hold: 10
    steps:
      - Begin in a standing upright position holding a resistance band in both hands that is anchored at your side.
      - Press your arms straight forward. Hold briefly, then bring your arms back in and repeat.
      - Make sure to keep your knees slightly bent and do not let your trunk rotate as you press the band forward.

  - id: PS-B-9
    name: Supine Lower Trunk Rotation
    sets: 3
    reps: 10
    hold: null
    steps:
      - Begin lying on your back with your feet flat on the floor and your arms straight out to your sides.
      - Lower your knees to one side, return to center, and repeat on the other side.
      - Make sure to activate your core muscles and keep both of your shoulders in contact with the ground throughout the exercise.

  - id: PS-B-10
    name: Supine 90/90 Alternating Toe Touch
    sets: 3
    reps: 10
    hold: null
    steps:
      - Lie on your back with your knees bent.
      - Lift your legs off the ground to form a 90 degree angle. Slowly lower one leg, touching your toes to the floor, then return to the starting position and repeat with the opposite leg.
      - Do not allow your low back to arch during the exercise.

  # ---- YouTube: Dr. Andrea Furlan - Lumbar Spinal Stenosis ----
  # Instructions closely follow the video's exercise cues, with brief added
  # safety cues for neutral-to-flexion-biased movement and symptom monitoring.

  - id: SS_EX_1
    name: Stationary Bike or Chair Cycle
    sets: 1
    reps: 1
    hold: 300
    steps:
      - Use a stationary bike or chair cycle at an easy, comfortable pace.
      - A slight forward bend is okay and is often comfortable with spinal stenosis.
      - Start with 5 minutes. Progress to 10, 20, then 30 minutes as tolerated.
      - Stop or ease off if leg pain, tingling, numbness, or heaviness clearly increases.

  - id: SS_EX_2
    name: Pelvic Tilt on the Wall
    sets: 1
    reps: 8
    hold: null
    steps:
      - Stand with your back against a wall or door and bend your knees slightly.
      - Tuck your navel in and gently tilt your pelvis so your lower back moves toward the wall.
      - Release, then repeat the tuck-and-release motion smoothly.
      - Keep the movement gentle and comfortable; do not force your back into pain.

  - id: SS_EX_3
    name: Cat-Cow
    sets: 1
    reps: 8
    hold: null
    steps:
      - Start on your hands and knees.
      - For Cow, gently let your spine move downward and look slightly up.
      - For Cat, look down and round your lower back upward, drawing your navel in.
      - Alternate slowly. Keep the Cow position small rather than forcing a deep back arch.
      - Start with 8 repetitions. Progress to 12, then 20 as tolerated.

  - id: SS_EX_4
    name: Bird-Dog
    sets: 1
    reps: 8
    hold: null
    steps:
      - Start on your hands and knees.
      - Reach one arm and the opposite leg away from you, such as right arm and left leg.
      - Reach long rather than high. Keep your head down and your trunk steady.
      - Tighten your abdominal and glute muscles, then return and switch sides.
      - If this is difficult, practice only the arms or only the legs first.
      - Do 8 repetitions per side. Progress to 12, then 20.

  - id: SS_EX_5
    name: Curl-Up
    sets: 1
    reps: 8
    hold: null
    steps:
      - Lie on your back with your knees bent.
      - Reach your arms forward and lift your head and upper trunk from the mat.
      - You do not need to sit all the way up. Lower back down and relax.
      - Arms reaching forward is the easier version; use a harder arm position only as you get stronger.
      - Start with 8 repetitions. Progress to 12, then 20.

  - id: SS_EX_6
    name: Dead Bug
    sets: 1
    reps: 8
    hold: null
    steps:
      - Lie on your back with your arms raised and your hips and knees bent.
      - Flatten your lower back against the mat and keep it there.
      - Straighten one leg at a time without touching the floor, then return.
      - As you progress, move the opposite arm and leg together.
      - Use a smaller range if your lower back starts lifting from the mat.
      - Start with 8 repetitions. Progress to 12, then 20.

  - id: SS_EX_7
    name: Bridge
    sets: 1
    reps: 8
    hold: 10
    steps:
      - Lie on your back with your knees bent, feet flat, and arms beside you.
      - Raise your pelvis while tightening your abdominal and glute muscles.
      - Lift only until your trunk and thighs form a comfortable straight line; do not over-arch your lower back.
      - Hold for 10 seconds, then lower with control.
      - Do 8 repetitions. As tolerated, the hold can progress toward 20 to 30 seconds.

  - id: SS_EX_8
    name: Pelvic Tilt Lying Down
    sets: 1
    reps: 8
    hold: null
    steps:
      - Lie on your back with a pillow under your head, knees bent, and feet apart.
      - Tilt your pelvis backward so your lower back moves toward the mat.
      - Then gently tilt forward and return.
      - Move slowly back and forth to improve lower-back mobility without forcing the range.
      - Start with 8 repetitions. Progress to 12, then 20.

  - id: SS_EX_9
    name: Hip Clam
    sets: 1
    reps: 8
    hold: null
    steps:
      - Lie on your side with a pillow under your head, knees bent, and feet together.
      - Keep your feet together and open the top knee like a clam.
      - Keep your hips stacked and avoid rolling your pelvis backward.
      - Lower with control. Do 8 repetitions, then turn over and repeat on the other side.
      - Progress to 12, then 20 per side as tolerated.

  - id: SS_EX_10
    name: Side-Lying Leg Lift
    sets: 1
    reps: 8
    hold: null
    steps:
      - Lie on your side with a pillow under your head.
      - Bend the lower knee and keep the upper leg straight.
      - Keep your body straight, your upper knee straight, and your toes pointing slightly down.
      - Raise the upper leg in a controlled motion, then lower it.
      - Do 8 repetitions, then turn over and repeat on the other side.
      - Progress to 12, then 20 per side as tolerated.

